[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nczpc-energy-sim"
version = "1.0.0"
description = "南昌零碳园区储能系统源网荷储协同优化仿真数学模型 (Nanchang Zero-Carbon Park Energy Sim)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nczpc" }]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
ems-sim = "ems_sim.cli:main"

[tool.setuptools]
packages = ["ems_sim"]

[tool.setuptools.package-data]
ems_sim = []
